<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savings Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }
    #app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }

    /* Left column (overview) / right column (accounts) */
    .overview-col { position: sticky; top: 16px; }
    .accounts-col { min-width: 0; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: auto 1fr auto 1fr;
      gap: 12px;
    }
    .cards-grid .section-label { grid-column: 1 / -1; }

    /* Interest history fold */
    .history-toggle {
      width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      background: none; border: none; cursor: pointer;
      padding: 8px 0; margin-bottom: 6px;
      border-top: 1px solid #1e1e2e;
      font-family: inherit; color: inherit; text-align: left;
    }
    .history-toggle .ht-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.07em; }
    .history-toggle .ht-value { font-size: 13px; font-weight: 700; color: #4ade80; }
    .history-toggle .chev { font-size: 10px; color: #555; margin-left: 6px; display: inline-block; transition: transform 0.15s; }
    .history-toggle .chev.open { transform: rotate(90deg); }
    .history-body { margin-bottom: 10px; }

    /* Header */
    .header-eyebrow { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
    .header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .header-date { font-size: 12px; color: #555; margin-top: 2px; margin-bottom: 14px; }

    /* Summary card */
    .summary-card {
      background: linear-gradient(135deg, #13131f 0%, #1a1a2e 100%);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #2a2a3e;
    }
    .summary-eyebrow { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .summary-total { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 10px; }
    .summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 14px; }
    .stat-label { font-size: 10px; color: #555; text-transform: uppercase; }
    .stat-value { font-size: 15px; font-weight: 600; }

    /* Monthly bar */
    .monthly-bar {
      background: #0a0a0f;
      border-radius: 12px;
      padding: 14px;
    }
    .monthly-bar-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; }
    .monthly-bar-stats { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .monthly-bar-stat { }
    .monthly-bar-stat.center { text-align: center; }
    .monthly-bar-stat.right { text-align: right; }
    .progress-track { background: #1e1e2e; border-radius: 6px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #4ade80, #facc15); }

    /* Section labels */
    .section-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

    /* Cards */
    .card {
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; flex-shrink: 0;
    }
    .logo-sm { font-size: 12px; }
    .logo-lg { font-size: 18px; }
    .card-bank { font-weight: 700; font-size: 15px; }
    .card-meta { font-size: 12px; color: #666; }
    .badge {
      font-size: 11px; border-radius: 6px; padding: 3px 8px;
      white-space: nowrap;
    }
    .platform-badge {
      font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 5px; margin-left: 6px;
    }

    /* Progress ring area */
    .card-body { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .ring-wrap { position: relative; flex-shrink: 0; }
    .ring-label {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .ring-pct { font-size: 22px; font-weight: 800; }
    .ring-days { font-size: 10px; color: #666; }
    .mini-stats { flex: 1; min-width: 0; }
    .mini-stat { margin-bottom: 6px; }
    .mini-stat:last-child { margin-bottom: 0; }
    .mini-stat-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.07em; }
    .mini-stat-value { font-size: 14px; font-weight: 700; }

    /* Bottom bar */
    .card-footer {
      display: flex; justify-content: space-between;
      background: #0a0a0f; border-radius: 10px; padding: 10px 14px;
      margin-top: auto;
    }
    .footer-item { }
    .footer-item.right { text-align: right; }
    .footer-item.center { text-align: center; }
    .footer-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.07em; }
    .footer-value { font-size: 14px; font-weight: 700; }

    /* Demand card specifics */
    .balance-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
    .balance-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
    .balance-value { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .aer-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 2px; }
    .aer-value { font-size: 20px; font-weight: 700; }
    .interest-row { display: flex; justify-content: space-between; padding: 6px 0; }
    .interest-date { font-size: 13px; color: #888; }
    .interest-amount { font-size: 13px; font-weight: 600; color: #4ade80; }

    /* Footer note */
    .footer-note { text-align: center; font-size: 11px; color: #333; margin-top: 8px; }

    /* Projection card */
    .projection-card {
      background: #13131f;
      border: 1px solid #2a2a3e;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
    }
    .projection-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .projection-title { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }
    .projection-note { font-size: 10px; color: #444; }
    .projection-chart { width: 100%; height: auto; display: block; margin-top: 6px; }
    .projection-stats { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #1e1e2e; }
    .chart-pt { cursor: pointer; }
    .chart-pt circle.dot { transition: r 0.15s; }
    .chart-pt:hover circle.dot { r: 5; }
    .chart-tip { opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .chart-pt:hover .chart-tip { opacity: 1; }

    /* Colors */
    .green { color: #4ade80; }
    .yellow { color: #facc15; }
    .white { color: #e8e8f0; }
    .muted { color: #aaa; }

    /* Responsive */
    @media (max-width: 980px) {
      #app { grid-template-columns: 1fr; max-width: 640px; }
      .overview-col { position: static; }
    }
    @media (max-width: 560px) {
      .cards-grid { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: auto; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

const DEMAND_ACCOUNTS = [
  {
    id: "resurs",
    bank: "Resurs Bank",
    country: "Sweden",
    rating: "AAA",
    ratingColor: "#4ade80",
    balance: 510.16,
    aer: 0.0205,
    accent: "#34d399",
    logo: "R",
    logoBg: "#065f46",
    logoColor: "#fff",
    platform: "Raisin",
  },
  {
    id: "traderepublic",
    bank: "Trade Republic",
    country: "Germany",
    rating: "N/A",
    ratingColor: "#888",
    balance: 50917.91,
    aer: 0.02,
    totalInterestPaid: 3854,
    accent: "#a78bfa",
    logo: "TR",
    logoBg: "#1e1040",
    logoColor: "#a78bfa",
    platform: "Trade Republic",
    lastInterest: [
      { date: "01 Jun", amount: 84.93 },
      { date: "01 May", amount: 82.19 },
      { date: "01 Apr", amount: 84.93 },
    ],
  },
];

const DEPOSITS = [
  {
    id: "klarna",
    bank: "Klarna Bank",
    country: "Sweden",
    rating: "AAA",
    ratingColor: "#4ade80",
    principal: 66667,
    aer: 0.0271,
    startDate: new Date("2026-06-11"),
    endDate: new Date("2027-06-11"),
    termLabel: "1 Year",
    accent: "#FFB3C7",
    logo: "K",
    logoBg: "#FFB3C7",
    logoColor: "#1a1a2e",
    noWithholding: true,
    platform: "Klarna",
  },
  {
    id: "ca",
    bank: "CA Auto Bank",
    country: "Italy",
    rating: "BBB+",
    ratingColor: "#facc15",
    principal: 42000.23,
    aer: 0.0241,
    startDate: new Date("2026-01-10"),
    endDate: new Date("2026-07-10"),
    termLabel: "6 Months",
    accent: "#60a5fa",
    logo: "CA",
    logoBg: "#1d4ed8",
    logoColor: "#fff",
    noWithholding: false,
    platform: "Raisin",
  },
];

// ── HELPERS ───────────────────────────────────────────────────────────────────

function today() { return new Date(); }

function getDaysPassed(start, end) {
  const now = today();
  const totalDays = Math.round((end - start) / 864e5);
  const passed = Math.max(0, Math.min(totalDays, Math.round((now - start) / 864e5)));
  return { passed, totalDays };
}

function calcInterest(principal, aer, totalDays) {
  return principal * aer * (totalDays / 365);
}

function euro(n) {
  return new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR" }).format(n);
}

function fmtDate(d) {
  return d.toLocaleDateString("en-IE", { day: "numeric", month: "short", year: "numeric" });
}

function platformStyle(platform) {
  if (platform === "Raisin") return "background:#7c3aed22;color:#a78bfa";
  if (platform === "Klarna") return "background:#FFB3C722;color:#FFB3C7";
  return "background:#1e104044;color:#a78bfa";
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function depositCardHTML(dep) {
  const { passed, totalDays } = getDaysPassed(dep.startDate, dep.endDate);
  const totalInterest = calcInterest(dep.principal, dep.aer, totalDays);
  const progress = passed / totalDays;
  const earned = totalInterest * progress;
  const remaining = totalInterest - earned;
  const currentValue = dep.principal + earned;
  const dailyRate = totalInterest / totalDays;
  const isMatured = today() >= dep.endDate;

  const radius = 54;
  const circ = 2 * Math.PI * radius;
  const dash = circ * Math.min(progress, 1);
  const ringColor = isMatured ? "#4ade80" : dep.accent;

  const badgeHTML = isMatured
    ? `<span class="badge" style="background:#4ade8022;color:#4ade80">Matured</span>`
    : `<span class="badge" style="background:${dep.accent}22;color:${dep.accent}">${dep.termLabel}</span>`;

  return `
  <div class="card" style="background:#13131f;border:1px solid ${dep.accent}22">
    <div class="card-header">
      <div class="logo ${dep.logo.length > 1 ? 'logo-sm' : 'logo-lg'}"
           style="background:${dep.logoBg};color:${dep.logoColor}">${dep.logo}</div>
      <div style="flex:1">
        <div class="card-bank">${dep.bank}</div>
        <div class="card-meta">${dep.country} ·
          <span style="color:${dep.ratingColor};margin-left:4px">${dep.rating}</span>
          ${dep.noWithholding ? '<span style="color:#4ade80;margin-left:6px">· No WHT</span>' : ''}
          <span class="platform-badge" style="${platformStyle(dep.platform)}">${dep.platform}</span>
        </div>
      </div>
      ${badgeHTML}
    </div>

    <div class="card-body">
      <div class="ring-wrap">
        <svg width="130" height="130" style="transform:rotate(-90deg)">
          <circle cx="65" cy="65" r="${radius}" fill="none" stroke="#1e1e2e" stroke-width="10"/>
          <circle cx="65" cy="65" r="${radius}" fill="none"
            stroke="${ringColor}" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${dash} ${circ}"/>
        </svg>
        <div class="ring-label">
          <div class="ring-pct" style="color:${ringColor}">${Math.round(progress * 100)}%</div>
          <div class="ring-days">${passed}d/${totalDays}d</div>
        </div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat"><div class="mini-stat-label">Principal</div><div class="mini-stat-value">${euro(dep.principal)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">Earned so far</div><div class="mini-stat-value green">${euro(earned)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">Current value</div><div class="mini-stat-value" style="color:${dep.accent}">${euro(currentValue)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">${isMatured ? 'Total earned' : 'Still to earn'}</div><div class="mini-stat-value yellow">${euro(isMatured ? totalInterest : remaining)}</div></div>
      </div>
    </div>

    <div class="card-footer">
      <div class="footer-item">
        <div class="footer-label">Daily</div>
        <div class="footer-value green">${euro(dailyRate)}/day</div>
      </div>
      <div class="footer-item center">
        <div class="footer-label">AER</div>
        <div class="footer-value" style="color:${dep.accent}">${(dep.aer * 100).toFixed(2)}%</div>
      </div>
      <div class="footer-item right">
        <div class="footer-label">${isMatured ? 'Matured' : 'Matures'}</div>
        <div class="footer-value muted">${fmtDate(dep.endDate)}</div>
      </div>
    </div>
  </div>`;
}

// Open/closed state of interest-history folds — survives the 60s re-render
const OPEN_HISTORY = new Set();
function toggleHistory(id) {
  OPEN_HISTORY.has(id) ? OPEN_HISTORY.delete(id) : OPEN_HISTORY.add(id);
  render();
}

function demandCardHTML(acc) {
  const dailyRate = (acc.balance * acc.aer) / 365;

  const hasHistory = acc.totalInterestPaid != null || acc.lastInterest;
  const isOpen = OPEN_HISTORY.has(acc.id);

  const historyToggleHTML = hasHistory
    ? `<button class="history-toggle" onclick="toggleHistory('${acc.id}')" aria-expanded="${isOpen}">
        <span class="ht-label">Total interest paid</span>
        <span class="ht-value">${acc.totalInterestPaid != null ? euro(acc.totalInterestPaid) : ''}<span class="chev ${isOpen ? 'open' : ''}">&#9656;</span></span>
       </button>` : '';

  const historyBodyHTML = (hasHistory && isOpen && acc.lastInterest)
    ? `<div class="history-body">
        <div class="mini-stat-label" style="font-size:11px;margin-bottom:8px">Recent Interest</div>
        ${acc.lastInterest.map((tx, i) =>
          `<div class="interest-row" style="${i < acc.lastInterest.length - 1 ? 'border-bottom:1px solid #1e1e2e' : ''}">
            <span class="interest-date">${tx.date}</span>
            <span class="interest-amount">+${euro(tx.amount)}</span>
          </div>`
        ).join('')}
       </div>` : '';

  return `
  <div class="card" style="background:#13131f;border:1px solid ${acc.accent}22">
    <div class="card-header">
      <div class="logo ${acc.logo.length > 1 ? 'logo-sm' : 'logo-lg'}"
           style="background:${acc.logoBg};color:${acc.logoColor}">${acc.logo}</div>
      <div style="flex:1">
        <div class="card-bank">${acc.bank}</div>
        <div class="card-meta">${acc.country} ·
          <span style="color:${acc.ratingColor};margin-left:4px">${acc.rating}</span>
          <span class="platform-badge" style="${platformStyle(acc.platform)}">${acc.platform}</span>
        </div>
      </div>
      <span class="badge" style="background:${acc.accent}22;color:${acc.accent}">Demand</span>
    </div>

    <div class="balance-row">
      <div>
        <div class="balance-label">Current Balance</div>
        <div class="balance-value" style="color:${acc.accent}">${euro(acc.balance)}</div>
      </div>
      <div style="text-align:right">
        <div class="aer-label">AER</div>
        <div class="aer-value" style="color:${acc.accent}">${(acc.aer * 100).toFixed(2)}%</div>
      </div>
    </div>

    ${historyToggleHTML}
    ${historyBodyHTML}

    <div class="card-footer">
      <div class="footer-item">
        <div class="footer-label">Daily accrual</div>
        <div class="footer-value green">${euro(dailyRate)}/day</div>
      </div>
      <div class="footer-item right">
        <div class="footer-label">Type</div>
        <div class="footer-value muted">Instant access</div>
      </div>
    </div>
  </div>`;
}

// ── 2026 PROJECTION ───────────────────────────────────────────────────────────

// Portfolio value at a future date. Assumptions:
// - Fixed deposits accrue linearly to maturity, then sit idle (not reinvested).
// - Demand balances accrue daily at current AER, no further contributions.
function portfolioValueAt(date) {
  const now = today();
  let total = 0;
  for (const dep of DEPOSITS) {
    const { totalDays } = getDaysPassed(dep.startDate, dep.endDate);
    const effDays = Math.max(0, Math.min(totalDays, Math.round((date - dep.startDate) / 864e5)));
    total += dep.principal + calcInterest(dep.principal, dep.aer, effDays);
  }
  for (const acc of DEMAND_ACCOUNTS) {
    const fwdDays = Math.max(0, Math.round((date - now) / 864e5));
    total += acc.balance + (acc.balance * acc.aer * fwdDays) / 365;
  }
  return total;
}

function projectionHTML() {
  const now = today();
  const year = now.getFullYear();

  // Points: today, then each remaining month-end of the current year
  const points = [{ date: now, label: "Now" }];
  for (let m = now.getMonth(); m < 12; m++) {
    const monthEnd = new Date(year, m + 1, 0);
    if (monthEnd <= now) continue;
    points.push({ date: monthEnd, label: monthEnd.toLocaleDateString("en-IE", { month: "short" }) });
  }
  points.forEach(p => { p.value = portfolioValueAt(p.date); });
  for (let i = 1; i < points.length; i++) {
    points[i].interest = points[i].value - points[i - 1].value;
    points[i].pct = (points[i].interest / points[i - 1].value) * 100;
  }

  // Chart geometry
  const W = 320, H = 150, padL = 8, padR = 8, padT = 26, padB = 34;
  const minV = Math.min(...points.map(p => p.value));
  const maxV = Math.max(...points.map(p => p.value));
  const span = Math.max(maxV - minV, 1);
  const x = i => padL + (i / (points.length - 1)) * (W - padL - padR);
  const y = v => padT + (1 - (v - minV) / span) * (H - padT - padB);

  const linePath = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${x(points.length - 1).toFixed(1)},${H - padB} L${padL},${H - padB} Z`;

  // Monthly interest bars along the baseline
  const maxInt = Math.max(...points.slice(1).map(p => p.interest), 1);
  const bars = points.slice(1).map((p, i) => {
    const bx = x(i + 1) - 5;
    const bh = Math.max(2, (p.interest / maxInt) * 16);
    return `<rect x="${bx.toFixed(1)}" y="${(H - padB + 4 - 0).toFixed(1)}" width="10" height="${bh.toFixed(1)}"
      transform="translate(0,${(-bh).toFixed(1)})" fill="#facc1555" rx="2"/>`;
  }).join('');

  const euroK = n => '€' + (n / 1000).toFixed(1) + 'k';

  const dots = points.map((p, i) => {
    const cx = x(i), cy = y(p.value);
    const tipW = 120, tipX = Math.max(2, Math.min(W - tipW - 2, cx - tipW / 2));
    const tipLines = i === 0
      ? [`Today · ${euroK(p.value)}`]
      : [`${p.label} ${p.date.getDate()} · ${euroK(p.value)}`, `+${euro(p.interest)} (+${p.pct.toFixed(2)}%)`];
    return `
    <g class="chart-pt">
      <rect x="${(cx - 12).toFixed(1)}" y="0" width="24" height="${H}" fill="transparent"/>
      <circle class="dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.5" fill="#4ade80" stroke="#0a0a0f" stroke-width="1.5"/>
      <text x="${cx.toFixed(1)}" y="${H - padB + 30}" text-anchor="middle" font-size="9" fill="#555">${p.label}</text>
      <g class="chart-tip">
        <rect x="${tipX}" y="2" width="${tipW}" height="${i === 0 ? 16 : 28}" rx="5" fill="#1e1e2e" stroke="#2a2a3e"/>
        ${tipLines.map((t, li) =>
          `<text x="${tipX + tipW / 2}" y="${13 + li * 12}" text-anchor="middle" font-size="9" fill="${li ? '#4ade80' : '#e8e8f0'}">${t}</text>`
        ).join('')}
      </g>
    </g>`;
  }).join('');

  const endPoint = points[points.length - 1];
  const interestRest = endPoint.value - points[0].value;

  return `
  <div class="projection-card">
    <div class="projection-header">
      <span class="projection-title">${year} Projection</span>
      <span class="projection-note">CA Auto idle after maturity</span>
    </div>
    <svg class="projection-chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="projFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4ade8044"/>
          <stop offset="100%" stop-color="#4ade8000"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#projFill)"/>
      <path d="${linePath}" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
      ${bars}
      ${dots}
    </svg>
    <div class="projection-stats">
      <div>
        <div class="stat-label">Dec ${year} projected</div>
        <div class="stat-value">${euro(endPoint.value)}</div>
      </div>
      <div style="text-align:right">
        <div class="stat-label">Interest to Dec 31</div>
        <div class="stat-value green">+${euro(interestRest)}</div>
      </div>
    </div>
  </div>`;
}

function render() {
  const now = today();

  // Portfolio totals
  const depositTotals = DEPOSITS.reduce((acc, dep) => {
    const { passed, totalDays } = getDaysPassed(dep.startDate, dep.endDate);
    const totalInterest = calcInterest(dep.principal, dep.aer, totalDays);
    const progress = passed / totalDays;
    const earned = totalInterest * progress;
    return { principal: acc.principal + dep.principal, earned: acc.earned + earned, total: acc.total + dep.principal + earned };
  }, { principal: 0, earned: 0, total: 0 });

  const demandBalance = DEMAND_ACCOUNTS.reduce((s, a) => s + a.balance, 0);

  const totals = {
    principal: depositTotals.principal + demandBalance,
    earned: depositTotals.earned,
    total: depositTotals.total + demandBalance,
  };

  const totalDailyReturn =
    DEPOSITS.reduce((sum, dep) => {
      const { totalDays } = getDaysPassed(dep.startDate, dep.endDate);
      return sum + calcInterest(dep.principal, dep.aer, totalDays) / totalDays;
    }, 0) +
    DEMAND_ACCOUNTS.reduce((sum, acc) => sum + (acc.balance * acc.aer) / 365, 0);

  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const dayOfMonth = now.getDate();
  const daysElapsed = dayOfMonth - 1;
  const monthLabel = now.toLocaleDateString("en-IE", { month: "long", year: "numeric" });
  const totalMonthly = totalDailyReturn * daysInMonth;
  const earnedMonth = totalDailyReturn * daysElapsed;
  const remainMonth = totalMonthly - earnedMonth;
  const monthPct = (daysElapsed / daysInMonth) * 100;

  const accountCount = DEPOSITS.length + DEMAND_ACCOUNTS.length;

  document.getElementById("app").innerHTML = `
    <div class="overview-col">
      <div class="header-eyebrow">Savings Portfolio</div>
      <div class="header-title">Savings Tracker</div>
      <div class="header-date">As of ${fmtDate(now)}</div>

      <div class="summary-card">
        <div class="summary-eyebrow">Total Portfolio</div>
        <div class="summary-total">${euro(totals.total)}</div>
        <div class="summary-stats">
          <div>
            <div class="stat-label">Invested</div>
            <div class="stat-value">${euro(totals.principal)}</div>
          </div>
          <div>
            <div class="stat-label">Earned</div>
            <div class="stat-value green">+${euro(totals.earned)}</div>
          </div>
          <div>
            <div class="stat-label">Daily Return</div>
            <div class="stat-value yellow">+${euro(totalDailyReturn)}/day</div>
          </div>
          <div>
            <div class="stat-label">Accounts</div>
            <div class="stat-value">${accountCount} active</div>
          </div>
        </div>

        <div class="monthly-bar">
          <div class="monthly-bar-header">
            <span>${monthLabel}</span>
            <span>${daysElapsed} / ${daysInMonth} days</span>
          </div>
          <div class="monthly-bar-stats">
            <div class="monthly-bar-stat">
              <div class="stat-label">Earned so far</div>
              <div style="font-size:16px;font-weight:700;color:#4ade80">+${euro(earnedMonth)}</div>
            </div>
            <div class="monthly-bar-stat center">
              <div class="stat-label">Full month</div>
              <div style="font-size:16px;font-weight:700;color:#e8e8f0">${euro(totalMonthly)}</div>
            </div>
            <div class="monthly-bar-stat right">
              <div class="stat-label">Still to earn</div>
              <div style="font-size:16px;font-weight:700;color:#facc15">+${euro(remainMonth)}</div>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${monthPct}%"></div>
          </div>
        </div>
      </div>

      ${projectionHTML()}

      <div class="footer-note">Raisin · Klarna · Trade Republic · Ireland · DIRT may apply</div>
    </div>

    <div class="accounts-col">
      <div class="cards-grid">
        <div class="section-label">Fixed Deposits</div>
        ${DEPOSITS.map(depositCardHTML).join('')}
        <div class="section-label">Demand Deposits</div>
        ${DEMAND_ACCOUNTS.map(demandCardHTML).join('')}
      </div>
    </div>
  `;
}

// Initial render + refresh every 60s
render();
setInterval(render, 60000);
</script>
</body>
</html>
